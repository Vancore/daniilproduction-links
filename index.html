<!DOCTYPE html>

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title & Favicon -->
    <title>Daniil Production — Official Hub</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Official hub for Daniil Production projects and digital services: Division, Creation, Continue, Metro, and Telegram community.">
    <link rel="canonical" href="https://daniilproduction.com/">
    <meta name="author" content="Daniil Production">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Open Graph Cards (Telegram, WhatsApp, Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Daniil Production">
    <meta property="og:title" content="Daniil Production — Official Hub">
    <meta property="og:description" content="Ecosystem of digital projects, products, and services.">
    <meta property="og:url" content="https://daniilproduction.com/">
    <meta property="og:image" content="https://daniilproduction.com/images/avatar.png">
    <meta property="og:image:alt" content="Daniil Production Logo">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Daniil Production — Official Hub">
    <meta name="twitter:description" content="Ecosystem of digital projects, products, and services.">
    <meta name="twitter:image" content="https://daniilproduction.com/images/avatar.png">

    <!-- Font Preloads -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- Brand Avatar -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Daniil Production" width="128" height="128" fetchpriority="high">

            <!-- Title & Subtitle -->
            <h1>Daniil Production</h1>
            <p>Ecosystem of digital projects & services</p>

            <!-- Project Links -->
            <nav class="button-stack" aria-label="Projects">

              <!-- 1. Telegram (Top Priority) -->
              <a class="button button-telegram" href="https://t.me/DaniilProduction" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram Logo">Telegram @DaniilProduction
              </a>

              <!-- 2. Division (Gold) -->
              <a class="button" href="https://division.daniilproduction.com/" target="_blank" rel="noopener" style="background: linear-gradient(135deg, #f5d061 0%, #e5a93c 100%); color: #1a1a1a; font-weight: 700; border: none;">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Division Icon" style="filter: brightness(0.1);">Division
              </a>

              <!-- 3. Creation (Gold) -->
              <a class="button" href="https://creation.daniilproduction.com/" target="_blank" rel="noopener" style="background: linear-gradient(135deg, #f5d061 0%, #e5a93c 100%); color: #1a1a1a; font-weight: 700; border: none;">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Creation Icon" style="filter: brightness(0.1);">Creation
              </a>

              <!-- 4. Continue (Gold) -->
              <a class="button" href="https://continue.daniilproduction.com/" target="_blank" rel="noopener" style="background: linear-gradient(135deg, #f5d061 0%, #e5a93c 100%); color: #1a1a1a; font-weight: 700; border: none;">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Continue Icon" style="filter: brightness(0.1);">Continue
              </a>

              <!-- 5. Metro (Red) -->
              <a class="button" href="https://metro.daniilproduction.com/" target="_blank" rel="noopener" style="background: #e63946; color: #ffffff; font-weight: 700; border: none;">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Metro Icon">Metro
              </a>

            </nav>
          </main>

          <footer>
            &copy; Daniil Production. All rights reserved.
          </footer>

        </div>
    </div>

</body>
</html>
