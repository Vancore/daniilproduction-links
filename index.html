<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="ru">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Заголовок страницы для Google -->
    <title>Daniil Production</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <!-- Описание для поиска и шаринга -->
    <meta name="description" content="Официальный хаб проектов Daniil Production: Telegram-канал @DaniilProduction, сервисы Continue, Creation, Metro и Division.">

    <!-- Канонический URL -->
    <link rel="canonical" href="https://daniilproduction.com/">

    <!-- Автор -->
    <meta name="author" content="Daniil Production">

    <!-- Цвет интерфейса браузера -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Open Graph (для превью ссылок в мессенджерах) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Daniil Production">
    <meta property="og:description" content="Официальный хаб проектов Daniil Production.">
    <meta property="og:url" content="https://daniilproduction.com/">
    <meta property="og:image" content="https://daniilproduction.com/images/avatar@2x.png">

    <!-- Предзагрузка шрифтов LittleLink -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Стили -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- Логотип / Аватарка (заменится, когда зальете свой avatar.png в папку images) -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Daniil Production" width="128" height="128" fetchpriority="high">

            <!-- Название бренда -->
            <h1>Daniil Production</h1>

            <!-- Подпись -->
            <p>Экосистема проектов и сервисов</p>

            <!-- Кнопки-ссылки -->
            <nav class="button-stack" aria-label="Links">

              <!-- Telegram-канал на самом верху -->
              <a class="button button-telegram" href="https://t.me/DaniilProduction" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram Logo">Telegram @DaniilProduction
              </a>

              <!-- Continue -->
              <a class="button button-default" href="https://continue.daniilproduction.com/ru/" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Continue Icon">Continue
              </a>

              <!-- Creation -->
              <a class="button button-default" href="https://creation.daniilproduction.com/" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/generic-code.svg" alt="Creation Icon">Creation
              </a>

              <!-- Metro -->
              <a class="button button-default" href="https://metro.daniilproduction.com/" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/generic-map.svg" alt="Metro Icon">Metro
              </a>

              <!-- Division -->
              <a class="button button-default" href="https://division.daniilproduction.com/" target="_blank" rel="noopener">
                <img class="icon" aria-hidden="true" src="images/icons/generic-cloud.svg" alt="Division Icon">Division
              </a>

            </nav>
          </main>

          <footer>
            &copy; Daniil Production
          </footer>

        </div>
    </div>

</body>

</html>
